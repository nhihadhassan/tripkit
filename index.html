<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripKit | Travel Planner</title>
  <style>
    :root { --bg: oklch(96% .014 205); --panel: oklch(99% .007 205); --line: oklch(86% .023 205); --ink: oklch(23% .03 215); --muted: oklch(49% .04 215); --accent: oklch(46% .14 185); --soft: oklch(93% .04 185); --warn: oklch(56% .15 35); }
    * { box-sizing: border-box; } body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    main { width: min(1220px, calc(100% - 32px)); margin: 28px auto 40px; } header { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 22px; }
    h1 { margin: 0 0 6px; font-size: 28px; } h2 { margin: 0 0 8px; font-size: 17px; } p { margin: 0; color: var(--muted); }
    button, input, select, textarea { font: inherit; border-radius: 8px; } button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 12px; cursor: pointer; } button.primary { background: var(--accent); border-color: var(--accent); color: oklch(98% .01 185); }
    input, select, textarea { border: 1px solid var(--line); background: oklch(100% .004 205); padding: 10px; color: var(--ink); width: 100%; } textarea { min-height: 70px; resize: vertical; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; } .grid { display: grid; grid-template-columns: 340px 1fr 300px; gap: 16px; align-items: start; }
    form, section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; } form { display: grid; gap: 12px; } label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; } .tabs button.active { border-color: var(--accent); color: var(--accent); background: var(--soft); }
    .stats { display: grid; gap: 10px; margin-bottom: 14px; } .stat { background: var(--soft); border-radius: 8px; padding: 12px; } .stat b { display: block; font-size: 20px; }
    .list { display: grid; gap: 10px; } .item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; } .top { display: flex; justify-content: space-between; gap: 10px; } .name { font-weight: 750; font-size: 16px; } .meta { color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .pill { width: fit-content; border-radius: 999px; padding: 4px 8px; background: var(--soft); color: var(--accent); font-size: 12px; font-weight: 750; } .warn { color: var(--warn); font-weight: 750; } .check { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: var(--ink); } .check input { width: auto; }
    .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 22px; text-align: center; }
    @media (max-width: 1000px) { .grid { grid-template-columns: 1fr 1fr; } .side { grid-column: 1 / -1; } } @media (max-width: 720px) { main { width: min(100% - 20px, 1220px); margin-top: 18px; } header, .grid, .row { display: grid; grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>TripKit</h1><p>Plan itinerary blocks, reservations, budget, documents, and packing in one offline-friendly travel board.</p></div><div class="actions"><button id="exportBtn">Export</button><button id="importBtn">Import</button><input id="importFile" type="file" accept="application/json" hidden></div></header>
    <div class="grid">
      <form id="itemForm"><h2>Add trip item</h2><label>Title <input name="title" required placeholder="Flight to Lisbon"></label><div class="row"><label>Type <select name="type"><option>Itinerary</option><option>Reservation</option><option>Budget</option><option>Document</option></select></label><label>Date <input name="date" type="date"></label></div><div class="row"><label>Amount <input name="amount" type="number" min="0" step="0.01" value="0"></label><label>Status <select name="status"><option>Planned</option><option>Booked</option><option>Done</option></select></label></div><label>Notes <textarea name="notes" placeholder="Confirmation, address, timing, link"></textarea></label><button class="primary">Save item</button></form>
      <section><div class="tabs" id="tabs"><button data-tab="all" class="active">All</button><button data-tab="Itinerary">Itinerary</button><button data-tab="Reservation">Reservations</button><button data-tab="Budget">Budget</button><button data-tab="Document">Docs</button></div><div class="list" id="list"></div></section>
      <section class="side"><h2>Trip summary</h2><div class="stats" id="stats"></div><h2>Packing</h2><form id="packForm"><label>Item <input name="name" required placeholder="Passport"></label><button class="primary">Add packing item</button></form><div id="packing" style="margin-top:10px"></div></section>
    </div>
  </main>
  <script>
    const key = "tripkit:v1";
    const today = () => new Date().toISOString().slice(0,10);
    const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
    let state = JSON.parse(localStorage.getItem(key) || "null") || { items: [
      { id: crypto.randomUUID(), title: "Book airport transfer", type: "Reservation", date: addDays(19), amount: 42, status: "Planned", notes: "Compare train vs private car" },
      { id: crypto.randomUUID(), title: "Museum afternoon", type: "Itinerary", date: addDays(22), amount: 18, status: "Booked", notes: "Timed tickets at 2pm" }
    ], packing: [{ id: crypto.randomUUID(), name: "Passport", done: false }, { id: crypto.randomUUID(), name: "Chargers", done: true }] };
    const form = document.querySelector("#itemForm"), packForm = document.querySelector("#packForm"), list = document.querySelector("#list"), stats = document.querySelector("#stats"), tabs = document.querySelector("#tabs"), packing = document.querySelector("#packing"), importFile = document.querySelector("#importFile");
    let activeTab = "all"; form.date.value = today();
    const money = n => n.toLocaleString(undefined, { style: "currency", currency: "USD" });
    function save() { localStorage.setItem(key, JSON.stringify(state)); render(); }
    form.onsubmit = e => { e.preventDefault(); const data = Object.fromEntries(new FormData(form)); state.items.push({ id: crypto.randomUUID(), ...data, amount: Number(data.amount) }); form.reset(); form.date.value = today(); save(); };
    packForm.onsubmit = e => { e.preventDefault(); state.packing.push({ id: crypto.randomUUID(), name: new FormData(packForm).get("name"), done: false }); packForm.reset(); save(); };
    tabs.onclick = e => { if (!e.target.dataset.tab) return; activeTab = e.target.dataset.tab; document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === activeTab)); render(); };
    document.querySelector("#exportBtn").onclick = () => download("tripkit-data.json", JSON.stringify(state, null, 2));
    document.querySelector("#importBtn").onclick = () => importFile.click();
    importFile.onchange = async () => { state = JSON.parse(await importFile.files[0].text()); save(); };
    function download(name, text) { const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([text], { type: "application/json" })), download: name }); a.click(); URL.revokeObjectURL(a.href); }
    function render() {
      const total = state.items.reduce((t,i) => t + Number(i.amount || 0), 0), booked = state.items.filter(i => i.status === "Booked").length, docs = state.items.filter(i => i.type === "Document").length, packed = state.packing.filter(p => p.done).length;
      stats.innerHTML = [["Budget", money(total)], ["Booked", booked], ["Docs", docs], ["Packed", `${packed}/${state.packing.length}`]].map(([l,v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
      const rows = state.items.filter(i => activeTab === "all" || i.type === activeTab).sort((a,b) => new Date(a.date || "2999-01-01") - new Date(b.date || "2999-01-01"));
      list.innerHTML = rows.length ? rows.map(i => `<article class="item"><div class="top"><div><div class="name">${i.title}</div><div class="meta"><span>${i.date || "No date"}</span><span>${money(Number(i.amount || 0))}</span><span>${i.status}</span></div></div><span class="pill">${i.type}</span></div><p>${i.notes || "No notes"}</p><div class="actions"><button onclick="cycleStatus('${i.id}')">Next status</button><button onclick="removeItem('${i.id}')">Delete</button></div></article>`).join("") : `<div class="empty">No trip items here yet. Add reservations, day plans, documents, or budget lines.</div>`;
      packing.innerHTML = state.packing.length ? state.packing.map(p => `<label class="check"><input type="checkbox" ${p.done ? "checked" : ""} onchange="togglePack('${p.id}')"><span>${p.name}</span><button onclick="removePack('${p.id}')">Delete</button></label>`).join("") : `<div class="empty">Add packing items you never want to forget.</div>`;
    }
    window.cycleStatus = id => { const order = ["Planned", "Booked", "Done"]; state.items = state.items.map(i => i.id === id ? { ...i, status: order[(order.indexOf(i.status) + 1) % order.length] } : i); save(); };
    window.removeItem = id => { state.items = state.items.filter(i => i.id !== id); save(); };
    window.togglePack = id => { state.packing = state.packing.map(p => p.id === id ? { ...p, done: !p.done } : p); save(); };
    window.removePack = id => { state.packing = state.packing.filter(p => p.id !== id); save(); };
    render();
  </script>
</body>
</html>
